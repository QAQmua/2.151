name: Build IPA (Direct Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认 Xcode 16 环境
        run: |
          xcodebuild -version

      - name: 规整工程目录
        run: |
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;
          TARGET_DIR=$(find . -name "Package.swift" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ 未找到 Package.swift 目录"
            exit 1
          fi
          rm -rf AppSource
          mv "$TARGET_DIR" AppSource
          find AppSource -name "Assets.xcassets" | tail -n +2 | while read -r dup; do rm -rf "$dup"; done

      - name: 执行编译与打包 IPA
        run: |
          cd AppSource
          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="AppModule"; fi
          echo "正在构建 Scheme: $SCHEME"

          # 1. 编译
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO

          # 2. 全盘精准抓取编译好的 .app（兼容 Swiftpm 的各种子路径）
          echo "正在定位生成的 .app..."
          APP_PATH=$(find ./build -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "扩大范围搜索..."
            APP_PATH=$(find . -type d -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ 仍未找到 .app，打印 build 目录结构以供排查："
            find ./build -maxdepth 5
            exit 1
          fi

          echo "✅ 成功找到 App: $APP_PATH"

          # 3. 组装 IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 4. 补齐并注入 Info.plist
          PLIST_PATH=$(find Payload -name "Info.plist" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            plutil -replace CFBundleIdentifier -string "com.youdong.app" "$PLIST_PATH"
            plutil -replace CFBundleName -string "幼刀" "$PLIST_PATH" || true
            plutil -replace CFBundleDisplayName -string "幼刀" "$PLIST_PATH" || true
          fi

          # 5. 打包为 IPA
          zip -qry output.ipa Payload
          mv output.ipa "$GITHUB_WORKSPACE/YouDao.ipa"
          echo "🎉 IPA 制作成功！"

      - name: 发布 Release 并提供 IPA 下载
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "幼刀 直装版 IPA (Build ${{ github.run_number }})"
          files: YouDao.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
