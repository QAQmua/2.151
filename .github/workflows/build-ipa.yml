name: Build IPA (Direct Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认 Xcode 16 环境
        run: |
          xcodebuild -version

      - name: 规整工程目录
        run: |
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;
          TARGET_DIR=$(find . -name "Package.swift" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ 未找到 Package.swift 目录"
            exit 1
          fi
          rm -rf AppSource
          mv "$TARGET_DIR" AppSource
          find AppSource -name "Assets.xcassets" | tail -n +2 | while read -r dup; do rm -rf "$dup"; done

      - name: 执行编译与自动装配 IPA
        run: |
          cd AppSource
          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="AppModule"; fi
          echo "正在构建 Scheme: $SCHEME"

          # 1. 编译生成二进制与资源包
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO

          # 2. 定位编译产物目录
          PRODUCTS_DIR=$(find ./build -type d -name "Release-iphoneos" | head -n 1)
          echo "产物目录: $PRODUCTS_DIR"

          # 3. 创建标准 iOS .app 目录结构
          mkdir -p Payload/YouDao.app

          # (1) 装配主执行程序二进制文件
          APP_BIN=$(find "$PRODUCTS_DIR" -maxdepth 1 -type f ! -name "*.*" ! -name ".*" | head -n 1)
          if [ -z "$APP_BIN" ]; then
            APP_BIN="$PRODUCTS_DIR/幼刀"
          fi
          echo "装配主程序: $APP_BIN"
          cp "$APP_BIN" Payload/YouDao.app/YouDao
          chmod +x Payload/YouDao.app/YouDao

          # (2) 装配所有资源包文件 (图片、资产、字体等)
          find "$PRODUCTS_DIR" -type d -name "*.bundle" | while read -r bndl; do
            echo "合并资源包: $bndl"
            cp -R "$bndl/"* Payload/YouDao.app/
          done

          # (3) 装配第三方依赖库 (如果有)
          if [ -d "$PRODUCTS_DIR/PackageFrameworks" ]; then
            mkdir -p Payload/YouDao.app/Frameworks
            cp -R "$PRODUCTS_DIR/PackageFrameworks/"* Payload/YouDao.app/Frameworks/
          fi

          # 4. 注入标准 Info.plist
          PLIST_PATH="Payload/YouDao.app/Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            plutil -create xml1 "$PLIST_PATH"
          fi
          plutil -replace CFBundlePackageType -string "APPL" "$PLIST_PATH"
          plutil -replace CFBundleExecutable -string "YouDao" "$PLIST_PATH"
          plutil -replace CFBundleIdentifier -string "com.youdong.app" "$PLIST_PATH"
          plutil -replace CFBundleName -string "幼刀" "$PLIST_PATH"
          plutil -replace CFBundleDisplayName -string "幼刀" "$PLIST_PATH"
          plutil -replace CFBundleShortVersionString -string "1.0" "$PLIST_PATH"
          plutil -replace CFBundleVersion -string "1" "$PLIST_PATH"
          plutil -replace MinimumOSVersion -string "17.0" "$PLIST_PATH"

          # 5. 打包生成 IPA
          zip -qry output.ipa Payload
          mv output.ipa "$GITHUB_WORKSPACE/YouDao.ipa"
          echo "🎉 YouDao.ipa 装配打包彻底完成！"

      - name: 发布 Release 并提供 IPA 下载
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "幼刀 直装版 IPA (Build ${{ github.run_number }})"
          files: YouDao.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
